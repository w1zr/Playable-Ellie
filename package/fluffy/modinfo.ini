name=Playable Ellie (WORKING)
version=v1.1
description=Play Joel's chapters of The Last of Us Part I as Ellie, done properly: she moves, aims, shoots, reloads, interacts and crafts in every chapter, Joel's 9mm sits straight in her hands, Joel follows her as the AI companion, the bow sits vertically on her back, and every Extras > Skins skin is unlocked. Works with ReShade and OptiScaler (the mod's on-screen messages turn off by themselves with them). Press F10 in game to switch between Ellie and the story character (restarts from your last checkpoint). Settings: Documents\Playable Ellie (WORKING)\PlayableEllie.ini (changes apply at the next game start). Known issues: after some cutscenes that change Joel's outfit you play as Joel again (press F10 twice); when the 9mm runs dry Ellie's arms stay out until you aim; short arms-out moments after a bow shot or reload; gun/arm twitch close to walls and cars; companion Joel speaks Ellie's lines. Loads as hid.dll next to tlou-i.exe. Single-player only; never writes save files itself.
author=w1z
screenshot=screenshot.png
