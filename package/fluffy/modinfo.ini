name=Playable Ellie (WORKING)
version=v1.0
description=Play Joel's chapters of The Last of Us Part I as Ellie, done properly: she moves, aims, shoots, reloads, interacts and crafts in every chapter, Joel's 9mm sits straight in her hands, and Joel follows her as the AI companion. Ellie is on by default and wears the outfit for the chapter. Press F10 in game to switch between Ellie and the story character (restarts from your last checkpoint); a small on-screen message shows the loading and "Swapped to Ellie". Settings: Documents\Playable Ellie (WORKING)\PlayableEllie.ini. Made from the playable Ellie in w1z's menu; if w1z's menu is installed, this mod steps aside (use the menu's Character page). Known issues: when the 9mm runs dry and the game switches weapons by itself, Ellie's arms stay out until you aim (Fix9mm=0 in the ini avoids it, but the 9mm then tilts up); the bow clips Ellie's arm when put away, the shotgun and hunting rifle twitch when aiming, and companion Joel speaks Ellie's lines. Loads as hid.dll next to tlou-i.exe. Single-player only; never writes save files itself.
author=w1z
screenshot=screenshot.png
