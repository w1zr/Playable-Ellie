; Playable Ellie (WORKING) - settings. The mod saves the on/off key's state here.

[PlayableEllie]
; 1 = play Joel's chapters as Ellie. The toggle key changes it in game.
PlayAsEllie=1
; Key that turns Ellie on / off in game and restarts from your last checkpoint
; as the other character (Windows virtual-key code, 0 = no key). 121 = F10.
ToggleKey=121
; 1 = the story companion Ellie becomes Joel while you play as Ellie.
JoelCompanion=1
; Ellie's outfit: 0 = the one Ellie wears in the chapter, 1-11 = a fixed outfit
; (costume 01, 02, 03, 04, 05, 06, 07, 08, 11, 13, 15). An Ellie skin chosen
; in Extras > Skins is drawn over it; pick Default there to see this one.
Outfit=0
; 1 = teach Ellie every crafting recipe after she spawns, so the crafting
; menu has something to show (the game saves it at the next checkpoint).
GiveRecipes=1
; 1 = Joel's 9mm sits straight in Ellie's hands. Known issue: when it runs
; dry and the game switches weapons by itself, her arms stay out until you
; aim. 0 = no freeze, but the 9mm tilts up in her hands.
Fix9mm=1
; 1 = small on-screen messages: loading Ellie's animations, swapped, errors.
; Off by itself when ReShade or OptiScaler is installed (both together crash).
Notifications=1
; 1 = also beep when the toggle key is pressed and when the swap is done.
Sounds=0
; 1 = write PlayableEllie.log next to the game exe.
Logging=1
; 1 = every Extras > Skins outfit and weapon skin unlocked and owned (no points
; spent, saves untouched), like TLOU Outfit Changer. 0 = the game's own locks.
UnlockSkins=1
; 1 = Joel's bow uses Ellie's bow settings while you play as Ellie, so it sits
; vertically on her back instead of across her backpack.
BowOnBack=1
; Changes in this file apply the next time the game starts.
